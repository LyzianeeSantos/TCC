<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcione Depiladora - Agendamento Online</title>

    <!-- links bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/servicos/agendamentoOline.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">

</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Login Section -->
    <div id="loginContainer"></div>

    <!-- Alert -->
    <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <div class="modal-servico"></div>

    <main>
        <div class="page-agendamentoline">
            <!-- Hero Section -->
            <section class="hero">
                <div class="hero-content">
                    <div class="hero-text">
                        <h2 class="hero-title">
                            Agende<br>
                            Online <span class="slash">/</span>
                        </h2>
                    </div>
                    <div class="hero-description">
                        <p>
                            Agora ficou ainda mais fácil cuidar de você. Nosso sistema de agendamento online permite que
                            você
                            escolha os serviços desejados em poucos cliques. Basta selecionar os tratamentos, adicionar
                            ao
                            agendamento, e escolher a data e horário que melhor se encaixam na sua rotina.
                        </p>
                    </div>
                </div>
            </section>

            <!-- Services Section -->
            <section class="services">
                <!-- Service Tabs -->
                <div class="service-tabs">
                    <button class="tab-button active" data-category="todos">Todos os serviços</button>
                    <button class="tab-button" data-category="pacote">Pacotes</button>
                    <button class="tab-button" data-category="depilacao">Depilação</button>
                    <button class="tab-button" data-category="acupuntura">Terapias</button>
                </div>

                <div class="service-grid">

            </section>
        </div>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <script type="module" src="/js/script.js"></script>
    <script src="./js/servicos/servico.js"></script>

</body>

</html>
