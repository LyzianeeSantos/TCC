<!-- Modal de Login/Cadastro -->
<div id="loginModal" class="modal">
    
    <div class="card-flip">
        <div class="card-inner" id="flipCard">
            <!-- Frente: Login -->
            <div class="card-front login-content">
                <div class="login-header">
                    <h2>Acesso</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="login-body">
                    <div class="login-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <p>Realize seu login</p>

                    <form id="formLogin">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Digite seu email">

                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua senha">

                        <a href="#" class="forgot">Esqueceu a senha?</a>

                        <button type="submit" class="login-btn">Login</button>
                    </form>

                    <p class="signup">Não possui um login? <a href="#" id="showRegister">Cadastre-se</a></p>
                </div>
            </div>

            <!-- Verso: Cadastro -->
            <div class="card-back login-content">
                <div class="login-header">
                    <h2>Cadastro</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="login-body">
                    <div class="login-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <p>Crie sua conta</p>

                    <form id="formCadastro">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Digite seu nome">

                        <label for="cad-email">Email</label>
                        <input type="email" id="cad-email" placeholder="Digite seu email">

                        <label for="celular">Celular</label>
                        <input type="tel" id="celular" placeholder="Digite seu número de celular">

                        <label for="cad-senha">Senha</label>
                        <input type="password" id="cad-senha" placeholder="Digite sua senha">

                        <button type="submit" class="login-btn">Cadastrar</button>
                    </form>

                    <p class="signup">Já possui login? <a href="#" id="showLogin">Acessar</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
